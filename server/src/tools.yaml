# Common definitions
_common:
  tabId: &tabId
    type: string
    description: Target tab ID

  selectorAndXpath: &selectorAndXpath
    selector:
      type: string
      description: The CSS selector to find a target Element for the action (uses first matching element)
    xpath:
      type: string
      description: An XPath expression to find a target Element for the action (alternative to selector, uses first matching element)

  oneOfSelectorOrXpath: &oneOfSelectorOrXpath
    oneOf:
      - required: [selector]
      - required: [xpath]

tools:
  list_tabs:
    description: List all connected browser tabs

  tab_detail:
    description: Get detailed information about a specific tab
    required: [tabId]
    properties:
      tabId: *tabId

  navigate:
    description: Navigate browser tab to specified URL
    required: [tabId, url]
    properties:
      tabId: *tabId
      url:
        type: string
        format: url
        description: URL to navigate to
      timeout:
        type: number
        description: Navigation timeout in milliseconds
        default: 30000

  back:
    description: Navigate back in browser history
    required: [tabId]
    properties:
      tabId: *tabId

  forward:
    description: Navigate forward in browser history
    required: [tabId]
    properties:
      tabId: *tabId

  click:
    description: >-
      Click on a page element using CSS selector or XPath (first match, its
      unique selector is returned), or at a viewport coordinate by passing x
      and y instead. Coordinates are CSS pixels relative to the viewport -
      NOT screenshot pixels; divide screenshot positions by the
      screenshot-to-viewport scale. Coordinate clicks hit whatever is at that
      point, including content inside iframes that selectors cannot reach.
    required: [tabId]
    properties:
      tabId: *tabId
      <<: *selectorAndXpath
      x:
        type: number
        description: Viewport x coordinate in CSS pixels (pair with y; alternative to selector/xpath)
      y:
        type: number
        description: Viewport y coordinate in CSS pixels (pair with x; alternative to selector/xpath)
    <<: *oneOfSelectorOrXpath

  hover:
    description: >-
      Hover over a page element using CSS selector or XPath (first match, its
      unique selector is returned), or at a viewport coordinate by passing x
      and y instead. Coordinates are CSS pixels relative to the viewport -
      NOT screenshot pixels; divide screenshot positions by the
      screenshot-to-viewport scale. Coordinate hovers hit whatever is at that
      point, including content inside iframes that selectors cannot reach.
    required: [tabId]
    <<: *oneOfSelectorOrXpath
    properties:
      tabId: *tabId
      <<: *selectorAndXpath
      x:
        type: number
        description: Viewport x coordinate in CSS pixels (pair with y; alternative to selector/xpath)
      y:
        type: number
        description: Viewport y coordinate in CSS pixels (pair with x; alternative to selector/xpath)

  focus:
    description: >-
      Set focus on a page element using CSS selector or XPath. Only the first 
      matching element will be focused. Returns the unique selector of the 
      focused element. Useful for form inputs, buttons, and other interactive 
      elements.
    required: [tabId]
    <<: *oneOfSelectorOrXpath
    properties:
      tabId: *tabId
      <<: *selectorAndXpath

  blur:
    description: >-
      Remove focus (blur) from a page element using CSS selector or XPath. Only 
      the first matching element will be blurred. Returns the unique selector of 
      the blurred element. Also removes focus from document.activeElement if 
      different.
    required: [tabId]
    <<: *oneOfSelectorOrXpath
    properties:
      tabId: *tabId
      <<: *selectorAndXpath

  fill:
    description: >-
      Fill an input field with a value using CSS selector or XPath. Only the 
      first matching element will be filled. Returns the unique selector of 
      the filled element.
    required: [tabId, value]
    <<: *oneOfSelectorOrXpath
    properties:
      tabId: *tabId
      <<: *selectorAndXpath
      value:
        type: string
        description: Value to fill in the input

  select:
    description: >-
      Select an option from an HTML <select> dropdown element using CSS 
      selector or XPath. Only the first matching select element will be used. 
      Returns the unique selector of the select element. Note: Only works with 
      native HTML select elements, not custom dropdowns.
    required: [tabId, value]
    <<: *oneOfSelectorOrXpath
    properties:
      tabId: *tabId
      <<: *selectorAndXpath
      value:
        type: string
        description: Value attribute of the option to select

  keypress:
    description: >-
      Send a keypress event to the current tab or a specific element. Uses 
      Chrome DevTools Protocol for proper key simulation including navigation 
      keys (Tab, PageDown, arrows) and function keys. When delay > 500ms, 
      automatically simulates holding the key down with repeated events.
    required: [tabId, key]
    properties:
      tabId: *tabId
      key:
        type: string
        description: >-
          The key combination to press. Can be a single key (e.g., "a", 
          "Enter", "Tab", "PageDown", "F5") or a combination with modifiers 
          (e.g., "Control+a", "Shift+Tab", "Alt+F4", "Meta+Shift+p"). 
          Special keys: Enter, Tab, Delete, Backspace, Escape, Space, 
          ArrowUp/Down/Left/Right, PageUp/Down, Home, End, Insert, F1-F12. 
          Modifiers: Control (or Ctrl), Shift, Alt, Meta (or Cmd on Mac)
      <<: *selectorAndXpath
      delay:
        type: number
        description: >-
          Delay in milliseconds between keydown and keyup events. Default: 
          50ms. Range: 0-60000ms. When > 500ms, simulates holding the key 
          down with auto-repeat
        default: 50
        minimum: 0
        maximum: 60000
      timeout:
        type: number
        description: >-
          Command timeout in milliseconds. Default: 5000ms. Automatically 
          extended for long delays
        minimum: 1000
        maximum: 70000

  type:
    description: >-
      Type a string as individual keystrokes (real keydown/keyup/input events
      per character) via Chrome DevTools Protocol. Unlike `fill`, this works on
      "fake" inputs and rich editors that ignore element.value and react to
      actual keypresses (autocomplete, input masks, contenteditable). Optionally
      focuses a target element first (CSS selector or XPath); otherwise types
      into the currently focused element. Types at the cursor (does not clear -
      use the `clear` tool first to replace existing content).
    required: [tabId, text]
    properties:
      tabId: *tabId
      text:
        type: string
        description: The text to type, character by character
      <<: *selectorAndXpath
      delay:
        type: number
        description: >-
          Delay in milliseconds between each keystroke. Default 0. Increase for
          sites that debounce or throttle input.
        default: 0
        minimum: 0
        maximum: 5000
      timeout:
        type: number
        description: >-
          Command timeout in milliseconds. Auto-extended based on text length
          and delay when not specified.
        minimum: 1000
        maximum: 120000

  insertText:
    description: >-
      Insert a whole string at once into the focused element via Chrome DevTools
      Protocol (like an IME commit or paste - fires input/beforeinput but no
      per-key events). Best for large blocks of text and editors that accept
      inserted text (e.g. Google Docs). For inputs that require real keystrokes,
      use `type` instead. Optionally focuses a target element first (CSS selector
      or XPath); otherwise inserts at the currently focused element's cursor.
    required: [tabId, text]
    properties:
      tabId: *tabId
      text:
        type: string
        description: The text to insert
      <<: *selectorAndXpath

  clear:
    description: >-
      Clear a text field by selecting all of its contents and deleting them with
      real key events (Ctrl/Cmd+A then Backspace) via Chrome DevTools Protocol.
      Works on inputs, textareas, contenteditable, and "fake" inputs that ignore
      element.value. Optionally focuses a target element first (CSS selector or
      XPath); otherwise clears the currently focused element.
    required: [tabId]
    properties:
      tabId: *tabId
      <<: *selectorAndXpath

  screenshot:
    description: >-
      Capture a screenshot of the page or specific element using CSS selector
      or XPath. When a selector/xpath is provided, only the first matching 
      element will be captured. Returns the unique selector of the captured 
      element if applicable.
    required: [tabId]
    properties:
      tabId: *tabId
      <<: *selectorAndXpath
      fullPage:
        type: boolean
        description: Capture the whole rendered page instead of the viewport
        default: false
      scale:
        type: number
        description: Scale factor (0.1-1.0) to reduce screenshot size (default 0.3)
        default: 0.3
        minimum: 0.1
        maximum: 1
      format:
        type: string
        description: Image format (default webp for best compression)
        default: webp
        enum: [webp, jpeg, png]
      quality:
        type: number
        description: Compression quality for webp/jpeg (0.1-1.0, default 0.85)
        default: 0.85
        minimum: 0.1
        maximum: 1


  dom:
    description: >-
      Get outerHTML of the body or a specific element using CSS selector or 
      XPath. When a selector/xpath is provided, only the first matching 
      element will be used. Returns the unique selector of the element if 
      applicable.
    required: [tabId]
    properties:
      tabId: *tabId
      <<: *selectorAndXpath

  elements:
    description: >-
      Query all elements matching a CSS selector or XPath and get detailed 
      information about each element. Use the visible parameter to filter 
      elements by visibility status.
    required: [tabId]
    <<: *oneOfSelectorOrXpath
    properties:
      tabId: *tabId
      <<: *selectorAndXpath
      visible:
        type: string
        description: Filter elements by visibility (true = only visible, false = only hidden, all = all elements)
        default: "all"
        enum: ["true", "false", "all"]

  scroll:
    description: >-
      Scroll the page or an element. Selector/xpath alone brings the element
      into view (centered vertically, nested scroll containers handled). x
      and/or y alone scrolls the document to that absolute coordinate. BOTH
      together scrolls within the element itself to that offset (e.g. an
      inner pane or infinite list) and returns the clamped landing position
      as elementScroll. A missing axis keeps the current offset (e.g. y:0
      jumps to the top). Returns the resulting scroll position.
    required: [tabId]
    properties:
      tabId: *tabId
      <<: *selectorAndXpath
      x:
        type: number
        description: Absolute horizontal scroll position in pixels (document coordinates, or within the element when a selector/xpath is given)
      y:
        type: number
        description: Absolute vertical scroll position in pixels (document coordinates, or within the element when a selector/xpath is given)

  dialog:
    description: >-
      Respond to a JavaScript dialog (alert, confirm, prompt, or
      onbeforeunload) that is blocking the tab. A dialog freezes the page -
      while one is open every other command fails fast with DIALOG_OPEN, and
      the command that triggered it returns a `dialog` field with its type
      and message. accept true presses OK/Leave, false presses Cancel/Stay
      (alerts close either way). For prompt() dialogs, text supplies the
      value to type before accepting.
    required: [tabId, accept]
    properties:
      tabId: *tabId
      accept:
        type: boolean
        description: true presses OK/Leave; false presses Cancel/Stay (alerts close either way)
      text:
        type: string
        description: Text to enter into a prompt() dialog before accepting

  elementsFromPoint:
    description: Get information about all elements at a specific coordinate in the viewport
    required: [tabId, x, y]
    properties:
      tabId: *tabId
      x:
        type: number
        description: X coordinate relative to the viewport
      y:
        type: number
        description: Y coordinate relative to the viewport

  cookies_get:
    description: Read cookies visible to the tab, optionally filtered by name or domain
    required: [tabId]
    properties:
      tabId: *tabId
      name:
        type: string
        description: Only return cookies with this exact name
      domain:
        type: string
        description: Only return cookies whose domain contains this string
      urls:
        type: array
        items:
          type: string
        description: Limit to cookies that would be sent to these URLs

  cookie_set:
    description: >-
      Set one cookie. Defaults to the current URL of the tab when neither url
      nor domain is given. The browser still enforces secure and sameSite rules.
    required: [tabId, name]
    properties:
      tabId: *tabId
      name:
        type: string
        description: Cookie name
      value:
        type: string
        description: Cookie value
      url:
        type: string
        description: URL the cookie belongs to
      domain:
        type: string
        description: Cookie domain, as an alternative to url
      path:
        type: string
        description: Cookie path
        default: /
      secure:
        type: boolean
        description: Send only over HTTPS
      httpOnly:
        type: boolean
        description: Hide from document.cookie
      sameSite:
        type: string
        enum: [Strict, Lax, None]
        description: SameSite policy
      expires:
        type: string
        description: Expiry as an ISO date string; omit for a session cookie

  cookies_clear:
    description: >-
      Delete cookies by name, or every cookie in the browser when no name is
      given - which signs the user out of every site, so pass a name unless
      that is genuinely intended.
    required: [tabId]
    properties:
      tabId: *tabId
      name:
        type: string
        description: Cookie name to delete
      domain:
        type: string
        description: Restrict deletion to domains containing this string

  storage_get:
    description: Read localStorage or sessionStorage for the origin of the tab
    required: [tabId]
    properties:
      tabId: *tabId
      area:
        type: string
        enum: [local, session]
        description: Which store to read
        default: local
      key:
        type: string
        description: Read one key; omit to return every key

  storage_set:
    description: Write or remove one key in localStorage or sessionStorage
    required: [tabId, key]
    properties:
      tabId: *tabId
      area:
        type: string
        enum: [local, session]
        description: Which store to write
        default: local
      key:
        type: string
        description: Key to write
      value:
        type: string
        description: Value to store
      remove:
        type: boolean
        description: Remove the key instead of writing it
        default: false

  clipboard_read:
    description: >-
      Read the system clipboard as text. Needs the tab focused and in front -
      call show first.
    required: [tabId]
    properties:
      tabId: *tabId

  clipboard_write:
    description: >-
      Write text to the system clipboard. Needs the tab focused and in front -
      call show first.
    required: [tabId, text]
    properties:
      tabId: *tabId
      text:
        type: string
        description: Text to place on the clipboard

  nav_history:
    description: >-
      Back and forward entries of this tab with titles and URLs. Scoped to the
      tab - this is not the browsing history of the user.
    required: [tabId]
    properties:
      tabId: *tabId
      limit:
        type: number
        description: Return at most this many of the most recent entries
        default: 25

  downloads:
    description: Recent browser downloads with their state, size and local filename
    required: [tabId]
    properties:
      tabId: *tabId
      limit:
        type: number
        description: Maximum entries to return
        default: 20
      state:
        type: string
        enum: [in_progress, interrupted, complete]
        description: Only return downloads in this state

  set_viewport:
    description: >-
      Override viewport size, device scale and the mobile flag of the tab, for
      checking responsive layouts. Persists until reset, so pass reset true
      when finished.
    required: [tabId]
    properties:
      tabId: *tabId
      width:
        type: number
        description: Viewport width in CSS pixels
      height:
        type: number
        description: Viewport height in CSS pixels
      deviceScaleFactor:
        type: number
        description: Device pixel ratio; 0 keeps the system value
        default: 0
      mobile:
        type: boolean
        description: Emulate a mobile device, including touch
        default: false
      reset:
        type: boolean
        description: Restore the real window size
        default: false

  emulate:
    description: >-
      Emulate environment that the page can read: colour scheme, reduced
      motion, geolocation, timezone, locale and user agent. Persists until reset.
    required: [tabId]
    properties:
      tabId: *tabId
      colorScheme:
        type: string
        enum: [light, dark]
        description: Value reported for prefers-color-scheme
      reducedMotion:
        type: string
        enum: [reduce, "no-preference"]
        description: Value reported for prefers-reduced-motion
      latitude:
        type: number
        description: Geolocation latitude, paired with longitude
      longitude:
        type: number
        description: Geolocation longitude, paired with latitude
      accuracy:
        type: number
        description: Geolocation accuracy in metres
        default: 50
      timezone:
        type: string
        description: IANA timezone id, e.g. Asia/Jakarta
      locale:
        type: string
        description: Accept-Language value, e.g. id-ID
      userAgent:
        type: string
        description: User-Agent string to report
      reset:
        type: boolean
        description: Clear every override set here
        default: false

  throttle:
    description: >-
      Emulate network conditions for the tab, to see a page behave on a slow
      link. Persists until reset.
    required: [tabId]
    properties:
      tabId: *tabId
      profile:
        type: string
        enum: [slow-3g, fast-3g, slow-4g, offline]
        description: Preset condition
      latency:
        type: number
        description: Added round-trip latency in milliseconds, instead of a profile
      downloadThroughput:
        type: number
        description: Bytes per second down; -1 for unlimited
      uploadThroughput:
        type: number
        description: Bytes per second up; -1 for unlimited
      reset:
        type: boolean
        description: Restore full speed
        default: false

  block_requests:
    description: >-
      Block requests whose URL matches any wildcard pattern - useful to test a
      page without analytics, fonts or a flaky third party. Persists until reset.
    required: [tabId]
    properties:
      tabId: *tabId
      patterns:
        type: array
        items:
          type: string
        description: Wildcard URL patterns, e.g. "*.doubleclick.net/*"
      reset:
        type: boolean
        description: Stop blocking everything
        default: false

  pdf:
    description: Print the page to PDF, returned as base64
    required: [tabId]
    properties:
      tabId: *tabId
      landscape:
        type: boolean
        description: Landscape orientation
        default: false
      printBackground:
        type: boolean
        description: Include background colours and images
        default: true
      scale:
        type: number
        description: Render scale
        default: 1
      paperWidth:
        type: number
        description: Paper width in inches
      paperHeight:
        type: number
        description: Paper height in inches
      pageRanges:
        type: string
        description: Pages to print, e.g. "1-3, 5"

  double_click:
    description: >-
      Double click an element (selector or xpath) or a viewport coordinate.
      Dispatched through CDP, so it reaches content a selector cannot - iframes
      included.
    required: [tabId]
    properties:
      tabId: *tabId
      <<: *selectorAndXpath
      x:
        type: number
        description: Viewport x in CSS pixels, paired with y, instead of a selector
      y:
        type: number
        description: Viewport y in CSS pixels, paired with x, instead of a selector

  right_click:
    description: >-
      Right click an element or coordinate. The page's own contextmenu handlers
      fire; a native browser context menu cannot be read or clicked by any tool.
    required: [tabId]
    properties:
      tabId: *tabId
      <<: *selectorAndXpath
      x:
        type: number
        description: Viewport x in CSS pixels, paired with y, instead of a selector
      y:
        type: number
        description: Viewport y in CSS pixels, paired with x, instead of a selector

  drag_and_drop:
    description: >-
      Press on a source, move across the page in steps, and release on a target.
      The intermediate moves are what make HTML5 and JS drag libraries engage.
    required: [tabId]
    properties:
      tabId: *tabId
      <<: *selectorAndXpath
      x:
        type: number
        description: Source viewport x, paired with y, instead of a selector
      y:
        type: number
        description: Source viewport y, paired with x, instead of a selector
      toSelector:
        type: string
        description: CSS selector for the drop target
      toXpath:
        type: string
        description: XPath for the drop target
      toX:
        type: number
        description: Drop viewport x, paired with toY
      toY:
        type: number
        description: Drop viewport y, paired with toX
      steps:
        type: number
        description: How many intermediate moves to dispatch
        default: 12

  upload_file:
    description: >-
      Set files on an <input type="file">. Paths are read by the browser
      process, so they must exist on the machine running Chrome.
    required: [tabId, files]
    properties:
      tabId: *tabId
      <<: *selectorAndXpath
      files:
        type: array
        items:
          type: string
        description: Absolute paths on the machine running the browser

  scroll_to:
    description: Scroll an element into view, without clicking or focusing it
    required: [tabId]
    properties:
      tabId: *tabId
      <<: *selectorAndXpath
      block:
        type: string
        enum: [start, center, end, nearest]
        description: Where the element should land vertically
        default: center
      behavior:
        type: string
        enum: [auto, smooth, instant]
        description: Scrolling behaviour
        default: smooth

  highlight:
    description: >-
      Draw a temporary box over every element matching the selector, with an
      optional label. Useful to show a person what the assistant is about to
      act on. Purely visual - it is hidden from screenshots.
    required: [tabId]
    properties:
      tabId: *tabId
      <<: *selectorAndXpath
      label:
        type: string
        description: Short text drawn above the box
      durationMs:
        type: number
        description: How long the boxes stay on screen
        default: 2500

  wait_for:
    description: >-
      Wait until an element (selector or xpath) or a piece of visible text
      reaches a state, instead of sleeping and hoping. States: visible (default),
      hidden, attached, detached. Returns how long it waited, or WAIT_TIMEOUT.
    required: [tabId]
    properties:
      tabId: *tabId
      <<: *selectorAndXpath
      text:
        type: string
        description: Visible text to wait for, as an alternative to selector/xpath
      state:
        type: string
        enum: [visible, hidden, attached, detached]
        description: Condition to wait for
        default: visible
      timeout:
        type: number
        description: Give up after this many milliseconds
        default: 10000

  wait_idle:
    description: >-
      Wait until the tab has had no network request in flight for a quiet
      period - the reliable way to let a page settle after navigate or click.
    required: [tabId]
    properties:
      tabId: *tabId
      quietMs:
        type: number
        description: How long the network must stay quiet to count as idle
        default: 500
      timeout:
        type: number
        description: Give up after this many milliseconds
        default: 15000

  find_text:
    description: >-
      Find visible text on the page. Returns the innermost element holding each
      match with its unique selector and bounds, so matches can be clicked or
      filled directly.
    required: [tabId, text]
    properties:
      tabId: *tabId
      text:
        type: string
        description: Text to search for
      limit:
        type: number
        description: Maximum matches to return
        default: 10
      caseSensitive:
        type: boolean
        description: Match case exactly
        default: false
      visibleOnly:
        type: boolean
        description: Skip matches that are not rendered
        default: true

  get_text:
    description: >-
      The page (or one element) as readable text rather than markup. Far
      cheaper than dom for reading an article, a result list or an error panel.
    required: [tabId]
    properties:
      tabId: *tabId
      <<: *selectorAndXpath
      maxChars:
        type: number
        description: Truncate the text at this length
        default: 20000
      includeLinks:
        type: boolean
        description: Also return the links found inside the root
        default: false

  a11y_snapshot:
    description: >-
      The accessibility tree of the tab - roles, names and values as assistive
      tech sees them. A compact, stable alternative to reading the DOM when
      deciding what to interact with.
    required: [tabId]
    properties:
      tabId: *tabId
      maxNodes:
        type: number
        description: Stop after this many nodes
        default: 400
      interestingOnly:
        type: boolean
        description: Drop presentational and unnamed nodes
        default: true

  console_logs:
    description: >-
      Get the browser tab's console contents - what you would see in the
      DevTools console, including console messages, uncaught exceptions, and
      browser-generated entries (network errors, violations, etc.). Returns
      newest first.
    required: [tabId]
    properties:
      tabId: *tabId
      before:
        type: string
        description: Get logs before this timestamp (for pagination)
      limit:
        type: integer
        description: Maximum number of logs to return
        default: 100
        minimum: 1
        maximum: 500
      level:
        type: string
        description: Filter logs by level (log, info, warn, error, debug, trace, table, group, groupCollapsed, groupEnd)
        enum: ["log", "info", "warn", "error", "debug", "trace", "table", "group", "groupCollapsed", "groupEnd"]

  watch_console:
    description: >-
      Watch a browser tab's console in real time. Collects console messages,
      uncaught exceptions, and browser-generated entries as they happen for
      the timeout duration, then returns them in chronological order. Useful
      for observing the result of an action (e.g. click something, then watch
      what the page logs).
    required: [tabId, timeout]
    properties:
      tabId: *tabId
      timeout:
        type: number
        description: How long to watch, in milliseconds
        minimum: 1000
        maximum: 60000

  network_monitor:
    description: >-
      Turn network monitoring on or off for a browser tab. While on, Wisp stays
      attached to the tab and records every network request (url, method, status,
      type, size, timing) into a buffer you read with `network_requests`; fetch an
      individual request/response body with `network_body`. The capture has NO
      history - it only sees requests that happen while monitoring is on, so
      enable it BEFORE the traffic you want to observe (e.g. before navigating or
      clicking). Enable is idempotent per caller: each watching client is tracked
      by identity, monitoring stays on until every watcher has disabled (or
      `force` is used), and a client's watchers are released automatically when
      it disconnects. The request buffer is cleared when monitoring fully stops.
      Extension 1.1.0+.
    required: [tabId, enabled]
    properties:
      tabId: *tabId
      enabled:
        type: boolean
        description: true to start monitoring, false to stop
      clientId:
        type: string
        description: >-
          Watcher identity for HTTP callers - pass the same value to enable and
          disable. MCP clients are identified automatically and should omit this.
          HTTP calls without one share a single 'http' identity.
      force:
        type: boolean
        description: With enabled:false, remove ALL watchers and stop monitoring unconditionally

  network_requests:
    description: >-
      List the network requests captured since monitoring was enabled. Returns
      lean metadata per request (plus `hasPostData` when the request carried a
      payload) and a `requestId` to pass to `network_body`. Each request has a
      monotonic `seq`; poll incrementally by passing the `cursor` from the
      previous call as `since` to get only newer requests. Returns
      monitoring:false (and an empty list) if monitoring is not currently on.
    required: [tabId]
    properties:
      tabId: *tabId
      since:
        type: number
        description: Only return requests with a seq greater than this cursor (use the `cursor` from a prior call). Omit for all buffered requests.
        minimum: 0
      limit:
        type: number
        description: Maximum number of requests to return
        default: 50
        minimum: 1
        maximum: 1000

  network_body:
    description: >-
      Fetch the bodies for a single captured request by `requestId` (from
      network_requests). Monitoring must be on. Returns the request payload as
      `requestBody` (when the request had one - see `hasPostData` in the list)
      and the response body as `body`, plus the request/response headers. The
      response body is read live from the browser, so it may be unavailable -
      evicted, from a page that has since navigated away, or a streaming
      (text/event-stream) response that CDP cannot read - which returns a
      `bodyError` instead. Binary bodies come back base64-encoded
      (base64Encoded:true).
    required: [tabId, requestId]
    properties:
      tabId: *tabId
      requestId:
        type: string
        description: The requestId from a network_requests entry
      maxBytes:
        type: number
        description: Maximum body bytes to return inline; longer bodies are truncated (bodyTruncated:true) while `size` still reports the full length
        default: 65536
        minimum: 1024
        maximum: 1048576

  evaluate:
    description: >-
      Execute JavaScript in the page and return the result. The code runs in
      the page's main world via Chrome DevTools Protocol; the result must be
      JSON-serializable. Promises are awaited. Only available when the user
      has enabled "Allow JavaScript Execution" for the tab in the Wisp
      extension. Prefer the purpose-built tools (click, fill, dom, elements,
      etc.) - only use evaluate when no other tool can accomplish the task.
    required: [tabId, code]
    properties:
      tabId: *tabId
      code:
        type: string
        description: JavaScript source to evaluate in the page
      timeout:
        type: number
        description: Command timeout in milliseconds
        default: 5000
        minimum: 1000
        maximum: 60000

  compose:
    description: >-
      Run a sequence of commands against a single tab in one call. The script is
      one command per line in the form `<tool>?<query-string>` - a URL query
      string whose keys are exactly that tool's own parameters. URL-encode each
      value: spaces as %20 or +, and especially &, %, and newlines (%0A). For
      example, two lines: `fill?selector=%23q&value=tom%20%26%20jerry` then
      `wait?t=500`. Commands run in order and stop
      at the first failure (a command erroring or not finding its element). The
      whole script is validated first, so an invalid script runs nothing.
      Returns an array of the per-command responses in order; on failure the
      last entry holds the error. Eligible commands: navigate, back, forward,
      reload, click, hover, focus, blur, fill, type, insertText, clear, select,
      keypress, scroll - plus `wait?t=<ms>` to pause between steps. The FINAL
      command may additionally be a data-returning read - screenshot, dom,
      elements, elementsFromPoint, console_logs, or watch_console - to verify
      the outcome in the same call (e.g. click then screenshot, or fill then
      console_logs). Data reads anywhere else, lifecycle (new_tab, close,
      show), and evaluate commands are not eligible.
    required: [tabId, script]
    properties:
      tabId: *tabId
      script:
        type: string
        description: One command per line, each as `<tool>?<query-string>`

  new_tab:
    description: >-
      Opens a new browser tab with the Wisp MCP usage documentation page. 
      The page will automatically connect to the Wisp server. Returns the 
      tab ID of the newly opened tab once it connects.
    properties:
      browser:
        type: string
        description: >-
          Optional browser to use. Supported values: chrome, edge, brave, opera, vivaldi.
          If not specified, uses the system default browser.
        enum: ["chrome", "edge", "brave", "opera", "vivaldi"]

  close:
    description: >-
      Closes a browser tab. The tab will be immediately closed and removed 
      from the connected tabs list.
    required: [tabId]
    properties:
      tabId: *tabId

  reload:
    description: >-
      Reloads the current page in the browser tab. Performs a standard page 
      reload similar to pressing F5 or clicking the browser's refresh button.
    required: [tabId]
    properties:
      tabId: *tabId

  show:
    description: >-
      Brings the browser tab to the front and focuses it. This will switch to 
      the tab's window and make it the active tab. Useful for directing user 
      attention to a specific tab when managing multiple browser tabs.
    required: [tabId]
    properties:
      tabId: *tabId
