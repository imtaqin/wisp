<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="head">
    <svg class="logo" viewBox="0 0 58 66" aria-hidden="true">
      <defs>
        <linearGradient id="wisp-logo" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#fde68a"/>
          <stop offset=".55" stop-color="#fbbf24"/>
          <stop offset="1" stop-color="#f59e0b"/>
        </linearGradient>
      </defs>
      <path d="M8 46q5 7 10.5 0t10.5 0 10.5 0 10.5 0V34H8Z" fill="url(#wisp-logo)"/>
      <path d="M29 6c11.6 0 21 9 21 20.5V40H8V26.5C8 15 17.4 6 29 6Z" fill="url(#wisp-logo)"/>
      <path d="M29 6c11.6 0 21 9 21 20.5V30c-3-9-11-15-21-15s-18 6-21 15v-3.5C8 15 17.4 6 29 6Z" fill="rgba(255, 251, 235, .45)"/>
      <ellipse cx="21" cy="27" rx="4" ry="5" fill="#1c1409"/>
      <ellipse cx="37" cy="27" rx="4" ry="5" fill="#1c1409"/>
      <circle cx="22.6" cy="25" r="1.3" fill="#fffbeb"/>
      <circle cx="38.6" cy="25" r="1.3" fill="#fffbeb"/>
      <path d="M24 35q5 4 10 0" stroke="#1c1409" stroke-width="2" fill="none" stroke-linecap="round"/>
    </svg>
    <div class="head-text">
      <h1>Wisp</h1>
      <span class="version" id="version">—</span>
    </div>
    <div class="server" id="server" title="MCP server on port 61822">
      <span class="server-dot"></span><span id="server-text">checking</span>
    </div>
  </header>

  <section class="card" id="main-card">
    <div class="card-row">
      <div class="state">
        <span class="state-dot"></span>
        <div>
          <div class="state-text" id="status-text">Disconnected</div>
          <div class="state-sub" id="tab-title">This tab</div>
        </div>
      </div>
      <label class="switch">
        <input type="checkbox" id="toggle">
        <span class="track"></span>
      </label>
    </div>
  </section>

  <section class="actions">
    <button class="action" id="connect-all" title="Connect every open http(s) tab">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 7H7a5 5 0 0 0 0 10h2m6-10h2a5 5 0 0 1 0 10h-2M8 12h8"/></svg>
      Connect all
    </button>
    <button class="action" id="disconnect-all" title="Disconnect every connected tab">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 7H7a5 5 0 0 0 0 10h2m6 0h2a5 5 0 0 0 3.5-8.5M4 4l16 16"/></svg>
      Disconnect all
    </button>
    <button class="action" id="dashboard" title="Open the server dashboard">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v12H4zM9 21h6M12 17v4"/></svg>
      Dashboard
    </button>
    <button class="action" id="copy-tab" title="Copy this tab's Wisp ID">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 9h10v10H9zM5 15H4V4h11v1"/></svg>
      Copy tab ID
    </button>
    <button class="action" id="reconnect" title="Drop and reopen this tab's connection">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 5v6h-6"/></svg>
      Reconnect
    </button>
    <button class="action" id="reload-ext" title="Reload the Wisp extension">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 13a8 8 0 1 0 2.3-5.7M4 19v-6h6"/></svg>
      Reload ext
    </button>
  </section>

  <section class="settings">
    <label class="setting">
      <div class="setting-text">
        <span>Auto-connect tabs</span>
        <small>Connect every tab as its page loads</small>
      </div>
      <span class="switch sm"><input type="checkbox" id="auto-toggle"><span class="track"></span></span>
    </label>

    <label class="setting">
      <div class="setting-text">
        <span>Show activity log</span>
        <small>Recent actions listed in the page corner</small>
      </div>
      <span class="switch sm"><input type="checkbox" id="log-toggle"><span class="track"></span></span>
    </label>

    <label class="setting">
      <div class="setting-text">
        <span>Show mascot</span>
        <small>The wisp drifts in the corner while driving</small>
      </div>
      <span class="switch sm"><input type="checkbox" id="mascot-toggle"><span class="track"></span></span>
    </label>

    <label class="setting danger-row">
      <div class="setting-text">
        <span>Allow JS by default</span>
        <small>Clients may run any script in connected tabs</small>
      </div>
      <span class="switch sm"><input type="checkbox" id="eval-default-toggle"><span class="track danger"></span></span>
    </label>

    <label class="setting danger-row" id="eval-row">
      <div class="setting-text">
        <span>Allow JS in this tab</span>
        <small id="eval-sub">Connect the tab first</small>
      </div>
      <span class="switch sm"><input type="checkbox" id="eval-toggle"><span class="track danger"></span></span>
    </label>
  </section>

  <footer class="foot">
    <span id="stats">no tabs connected</span>
    <span class="toast" id="toast"></span>
  </footer>

  <script src="popup.js"></script>
</body>
</html>
